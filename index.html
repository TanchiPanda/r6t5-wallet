<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R6T5 Wallet - 积分中心</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:"Comic Sans MS","Chalkboard SE","Microsoft Yahei","PingFang SC",sans-serif; }
body { background:linear-gradient(135deg,#162a22,#1a3a2e); color:#e0f0e8; min-height:100vh; padding:20px; max-width:600px; margin:0 auto; }
h1 { margin-bottom:20px; font-size:22px; }
.card { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:12px; padding:20px; margin-bottom:16px; }
.credits-display { text-align:center; padding:20px; }
.credits-num { font-size:48px; font-weight:bold; color:#ffd54f; }
.plan-badge { display:inline-block; padding:4px 12px; border-radius:20px; font-size:13px; margin-top:8px; background:#4ecdc4; color:#162a22; font-weight:bold; }
.plan-badge.one { background:#ffd54f; }
.plan-badge.pro { background:linear-gradient(90deg,#ff6b6b,#feca57,#48dbfb,#1dd1a1); color:#000; }
.btn { display:block; width:100%; padding:14px; border:none; border-radius:10px; font-size:15px; cursor:pointer; margin-top:10px; font-weight:bold; }
.btn-primary { background:linear-gradient(135deg,#4a9e6e,#5ab87e); color:#fff; }
.btn-gold { background:linear-gradient(135deg,#d4a017,#f5c842); color:#1a1a1a; }
.btn-rainbow { background:linear-gradient(135deg,#ff6b6b,#feca57,#48dbfb,#1dd1a1); color:#1a1a1a; }
.btn:disabled { opacity:0.5; cursor:not-allowed; }
.status { margin-top:12px; font-size:13px; text-align:center; }
input { width:100%; padding:12px; border-radius:10px; border:1px solid rgba(255,255,255,0.2); background:rgba(255,255,255,0.05); color:#fff; font-size:14px; margin-top:8px; }
</style>
</head>
<body>
<h1>💰 R6T5 Wallet 积分中心</h1>

<div class="card credits-display">
  <div class="credits-num" id="creditsNum">--</div>
  <div style="font-size:13px;color:#aaa;">游戏积分</div>
  <div class="plan-badge" id="planBadge">--</div>
  <div style="font-size:12px;color:#aaa;margin-top:4px;" id="planExpires"></div>
</div>

<div class="card">
  <h3 style="margin-bottom:12px;font-size:15px;">📅 每日签到</h3>
  <button class="btn btn-primary" id="checkinBtn" onclick="doCheckin()">每日签到</button>
  <div class="status" id="checkinStatus"></div>
</div>

<div class="card">
  <h3 style="margin-bottom:12px;font-size:15px;">⬆️ 升级计划</h3>
  <button class="btn btn-gold" id="buyOneBtn" onclick="buyOne()">
    Club One · 1500 积分/永久
    <div style="font-size:11px;font-weight:normal;margin-top:4px;">单买词书 8 折 · 签到 +600/天</div>
  </button>
  <button class="btn btn-rainbow" id="buyProBtn" onclick="buyPro()">
    Club One Pro · 666 积分/年
    <div style="font-size:11px;font-weight:normal;margin-top:4px;">全部课时 · 彩虹主题 · 签到 +600/天</div>
  </button>
  <div class="status" id="buyStatus"></div>
</div>

<div class="card">
  <h3 style="margin-bottom:12px;font-size:15px;">🎁 新用户福利</h3>
  <button class="btn btn-rainbow" id="trialBtn" onclick="claimTrial()">
    领取 One Pro 90 天免费试用
    <div style="font-size:11px;font-weight:normal;margin-top:4px;">过期自动降为 Free，仅限一次</div>
  </button>
  <div class="status" id="trialStatus"></div>
</div>

<div class="card">
  <h3 style="margin-bottom:12px;font-size:15px;">📚 词书商城（单买）</h3>
  <div id="bookList" style="display:flex;flex-direction:column;gap:8px;">
    <div style="display:flex;justify-content:space-between;padding:10px;background:rgba(255,255,255,0.05);border-radius:8px;">
      <span>初二秋季教材（383 词）</span>
      <span style="color:#ffd54f;font-weight:bold;">38.3 积分/年</span>
    </div>
    <div style="display:flex;justify-content:space-between;padding:10px;background:rgba(255,255,255,0.05);border-radius:8px;">
      <span>示例·旅行英语</span>
      <span style="color:#ffd54f;font-weight:bold;">12.5 积分/年</span>
    </div>
    <div style="display:flex;justify-content:space-between;padding:10px;background:rgba(255,255,255,0.05);border-radius:8px;">
      <span>示例·日常口语</span>
      <span style="color:#ffd54f;font-weight:bold;">10.0 积分/年</span>
    </div>
    <div style="display:flex;justify-content:space-between;padding:10px;background:rgba(255,255,255,0.05);border-radius:8px;">
      <span>英语课程标准2022单词表初中</span>
      <span style="color:#ffd54f;font-weight:bold;">85.0 积分/年</span>
    </div>
  </div>
  <p style="font-size:12px;color:#aaa;margin-top:8px;">Club One 用户单买 8 折</p>
</div>

<div class="card">
  <h3 style="margin-bottom:12px;font-size:15px;">💎 充值积分</h3>
  <input type="number" id="rechargeAmount" placeholder="充值积分数" min="100">
  <button class="btn btn-primary" onclick="doRecharge()">充值（灰度测试）</button>
  <div class="status" id="rechargeStatus"></div>
</div>

<script>
var user = null;
try { user = JSON.parse(localStorage.getItem("wordGameGitHubUser") || "null"); } catch (e) {}
var uid = user ? (user.email || user.login || user.id || "") : "";
var planNames = { free: "Club Free", one: "Club One", pro: "Club One Pro" };
var planBadgeClass = { free: "", one: "one", pro: "pro" };

if (!uid) {
  document.getElementById("creditsNum").textContent = "请先登录";
} else {
  refresh();
}

function refresh() {
  fetch("https://api.r6t5.dpdns.org/api/user?user_id=" + encodeURIComponent(uid))
    .then(function (r) { return r.json(); })
    .then(function (d) {
      document.getElementById("creditsNum").textContent = d.credits;
      var badge = document.getElementById("planBadge");
      badge.textContent = planNames[d.plan] || d.plan;
      badge.className = "plan-badge " + (planBadgeClass[d.plan] || "");
      if (d.plan_expires) {
        document.getElementById("planExpires").textContent = "到期：" + new Date(d.plan_expires).toLocaleDateString("zh-CN");
      } else {
        document.getElementById("planExpires").textContent = d.plan === "free" ? "免费计划" : "永久有效";
      }
      var btn = document.getElementById("checkinBtn");
      if (d.checked_in_today) {
        btn.disabled = true;
        btn.textContent = "今日已签到";
      } else {
        btn.disabled = false;
        btn.textContent = "每日签到（+" + (d.plan === "pro" || d.plan === "one" ? 600 : 200) + "积分）";
      }
      document.getElementById("buyOneBtn").style.display = (d.plan === "free") ? "" : "none";
      document.getElementById("buyProBtn").style.display = (d.plan === "free" || d.plan === "one") ? "" : "none";
      // 试用按钮状态
      var trialBtn = document.getElementById("trialBtn");
      if (d.trial_claimed || d.plan === "pro" || d.plan === "one") {
        trialBtn.disabled = true;
        trialBtn.textContent = "已领取过试用";
      } else {
        trialBtn.disabled = false;
      }
    });
}

function doCheckin() {
  fetch("https://api.r6t5.dpdns.org/api/checkin?user_id=" + encodeURIComponent(uid), { method: "POST" })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d.ok) {
        document.getElementById("checkinStatus").innerHTML = '<span style="color:#7ee;">✅ 签到成功，获得 ' + d.reward + ' 积分</span>';
        refresh();
      } else {
        document.getElementById("checkinStatus").innerHTML = '<span style="color:#e88;">' + (d.error || "签到失败") + '</span>';
      }
    });
}

function buyOne() {
  if (!confirm("确认花费 1500 积分购买 Club One（永久，单买词书 8 折）？")) return;
  fetch("https://api.r6t5.dpdns.org/api/buy-one?user_id=" + encodeURIComponent(uid), { method: "POST" })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d.ok) {
        document.getElementById("buyStatus").innerHTML = '<span style="color:#7ee;">✅ 已开通 Club One</span>';
        refresh();
      } else {
        document.getElementById("buyStatus").innerHTML = '<span style="color:#e88;">' + (d.error || "购买失败") + '</span>';
      }
    });
}

function buyPro() {
  if (!confirm("确认花费 666 积分购买 Club One Pro（1 年，全部课时）？")) return;
  fetch("https://api.r6t5.dpdns.org/api/buy-pro?user_id=" + encodeURIComponent(uid), { method: "POST" })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d.ok) {
        document.getElementById("buyStatus").innerHTML = '<span style="color:#7ee;">✅ 已开通 Club One Pro（1 年）</span>';
        refresh();
      } else {
        document.getElementById("buyStatus").innerHTML = '<span style="color:#e88;">' + (d.error || "购买失败") + '</span>';
      }
    });
}

function doRecharge() {
  var amt = parseInt(document.getElementById("rechargeAmount").value);
  if (!amt || amt < 100) { alert("请输入至少 100 积分"); return; }
  document.getElementById("rechargeStatus").innerHTML = '<span style="color:#aaa;">充值功能灰度测试中，暂未开放</span>';
}

function claimTrial() {
  if (!confirm("确认领取 One Pro 90 天免费试用？（仅限一次，过期自动降为 Free）")) return;
  fetch("https://api.r6t5.dpdns.org/api/trial?user_id=" + encodeURIComponent(uid), { method: "POST" })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d.ok) {
        document.getElementById("trialStatus").innerHTML = '<span style="color:#7ee;">✅ 已领取 One Pro 90 天免费试用</span>';
        refresh();
      } else {
        document.getElementById("trialStatus").innerHTML = '<span style="color:#e88;">' + (d.error || "领取失败") + '</span>';
      }
    });
}
</script>
</body>
</html>
