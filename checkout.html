<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R6T5 Wallet - 结账</title>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<script src="https://js.stripe.com/dahlia/stripe.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:"Comic Sans MS","Chalkboard SE","Microsoft Yahei","PingFang SC",sans-serif; }
body { background:linear-gradient(135deg,#162a22,#1a3a2e); color:#e0f0e8; min-height:100vh; padding:20px; max-width:600px; margin:0 auto; }
h1 { margin-bottom:20px; font-size:22px; }
.card { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:12px; padding:20px; margin-bottom:16px; }
.order-row { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid rgba(255,255,255,0.1); }
.order-row:last-child { border-bottom:none; }
.order-label { color:#aaa; }
.order-value { font-weight:bold; }
.status { margin-top:12px; font-size:13px; text-align:center; }
.order-id { font-size:18px; font-weight:bold; color:#ffd54f; text-align:center; padding:20px; background:rgba(255,213,79,0.1); border-radius:10px; margin:16px 0; }
#checkout-form { min-height:300px; }
</style>
</head>
<body>
<h1>💳 确认订单</h1>

<div id="orderInfo">
  <div class="card">
    <div class="order-row">
      <span class="order-label">商品</span>
      <span class="order-value" id="itemName">--</span>
    </div>
    <div class="order-row">
      <span class="order-label">价格</span>
      <span class="order-value" id="itemPrice">--</span>
    </div>
  </div>

  <!-- 测试产品弹窗 -->
  <div id="testModal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);z-index:1000;display:flex;align-items:center;justify-content:center;">
    <div style="background:#1a3a2e;padding:24px;border-radius:16px;max-width:400px;margin:20px;">
      <h3 style="margin-bottom:12px;">⚠️ 测试产品提示</h3>
      <p style="font-size:13px;line-height:1.6;color:#ccc;margin-bottom:16px;">
        此为测试产品，<b style="color:#ffd54f;">不会产生真实扣费</b>。<br><br>
        当市场规模稳定后，当前测试订阅将失效，您需要按期支付费用以继续使用。
      </p>
      <div class="cf-turnstile" data-sitekey="0x4AAAAAAFNdFDGD5uPcjBhh" data-callback="onTurnstile"></div>
      <button id="confirmBtn" onclick="confirmTest()" disabled style="width:100%;padding:12px;border:none;border-radius:10px;background:#4ecdc4;color:#162a22;font-weight:bold;cursor:pointer;margin-top:12px;">我知道了</button>
    </div>
  </div>

  <div style="margin:16px 0;">
    <div id="checkout-form">
      <div style="padding:20px;background:rgba(255,255,255,0.05);border-radius:10px;text-align:center;color:#aaa;font-size:13px;">
        请先完成上方测试提示确认
      </div>
    </div>
  </div>
  <div class="status" id="payStatus"></div>
</div>

<div id="orderDone" style="display:none;">
  <div class="card">
    <h3 style="text-align:center;margin-bottom:16px;">✅ 支付成功</h3>
    <div class="order-id" id="orderId">--</div>
    <p style="text-align:center;font-size:13px;color:#aaa;margin-bottom:8px;">请截图保存此订单号，如有问题请联系客服</p>
    <p style="text-align:center;font-size:12px;color:#888;">
      退款政策：购买后 7 天内可申请退款（扣除已使用部分）<br>
      如有问题请联系 gm.heheb@gmail.com
    </p>
  </div>
  <button onclick="goBack()" style="display:block;width:100%;padding:14px;border:none;border-radius:10px;font-size:15px;cursor:pointer;font-weight:bold;background:linear-gradient(135deg,#4a9e6e,#5ab87e);color:#fff;margin-top:10px;">返回</button>
</div>

<script>
var STRIPE_PK = "pk_test_51UT946J9TOBZ3WMOFN21LYnIitrlsujE0xNfhs5cPgBkqml0XVOL9SIo5lg5lF1b6Z6c9JgBNaG8Ms1ap9TR4QVR00oUiZmVO2";
var stripe = Stripe(STRIPE_PK);

var params = new URLSearchParams(location.search);
var app = params.get("app") || "wordgm";
var bookid = params.get("bookid");
var isPro = params.get("pro") === "true";
var uid = params.get("uid") || "";

// 判断模式：订阅 vs 一次性
var mode = (app === "one") ? "subscription" : "payment";

// 加载订单信息
function loadOrder() {
  var itemName = "", itemPrice = 0;
  if (app === "one") {
    if (isPro) { itemName = "Club One Pro（1 年）"; itemPrice = "¥6.66 / 年"; }
    else { itemName = "Club One（永久）"; itemPrice = "¥15 / 永久"; }
  } else if (app === "wordgm" && bookid) {
    itemName = "词书「" + bookid + "」（1 年）";
    itemPrice = "¥3.83 / 年";
  }
  document.getElementById("itemName").textContent = itemName;
  document.getElementById("itemPrice").textContent = itemPrice;
}

loadOrder();

// Turnstile 验证
var turnstileToken = null;
function onTurnstile(token) {
  turnstileToken = token;
  document.getElementById("confirmBtn").disabled = false;
}

// 确认测试提示后加载支付表单
function confirmTest() {
  document.getElementById("testModal").style.display = "none";
  loadCheckoutForm();
}

// 加载 Stripe 支付表单
function loadCheckoutForm() {
  // 创建 Checkout Session
  fetch("https://api.r6t5.dpdns.org/api/create-checkout-session", {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify({
    uid: uid,
    app: app,
    bookid: bookid,
    isPro: isPro,
    mode: mode
  })
})
.then(function (r) { return r.json(); })
.then(function (d) {
  if (d.client_secret) {
    initCheckoutForm(d.client_secret);
  } else {
    document.getElementById("checkout-form").innerHTML = '<div style="color:#e88;">支付初始化失败：' + (d.error || "未知错误") + '</div>';
  }
})
.catch(function () {
  document.getElementById("checkout-form").innerHTML = '<div style="color:#e88;">网络错误，请刷新重试</div>';
});
}

function initCheckoutForm(clientSecret) {
  var appearance = {
    theme: "stripe",
    labels: "auto",
    inputs: "spaced",
    variables: {
      borderRadius: "4px",
      colorBackground: "#ffffff",
      colorDanger: "#df1b41",
      colorPrimary: "#0570de",
      colorSuccess: "#00c853",
      colorText: "#30313d",
      fontFamily: "default",
      fontSizeBase: "16px",
      spacingUnit: "4px"
    }
  };

  var checkout = stripe.initCheckoutFormSdk({ clientSecret: clientSecret, appearance: appearance });
  var form = checkout.createForm({ layout: "expanded" });
  form.mount("#checkout-form");

  checkout.loadActions().then(function (result) {
    if (result.type === "success") {
      form.on("confirm", async function (event) {
        try {
          await result.actions.confirm({ formConfirmEvent: event });
        } catch (error) {
          document.getElementById("payStatus").innerHTML = '<span style="color:#e88;">' + error.message + '</span>';
        }
      });
    }
  });
}

function goBack() {
  location.href = "https://wordgm.r6t5.dpdns.org/";
}
</script>
</body>
</html>
